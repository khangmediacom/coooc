name: Build Android APK
on:
  push:
    branches: [ "main" ] # Hoặc nhánh master tùy ông đặt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cài thư viện và Build Web (Vite)
        run: |
          npm install
          npm run build

      - name: Cài đặt Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync web vào Android qua Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build file APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload file APK lên GitHub
        uses: actions/upload-artifact@v3
        with:
          name: TeanhProt-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
